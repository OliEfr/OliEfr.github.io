- id2: comCompression
  title: Communication Compression for Tensor Parallel LLM Inference
  arxiv: "2411.09510" # Required as string, as liquid ignores trailing zeros https://stackoverflow.com/questions/37862167/trailing-zeros-in-jekyll-liquid
  description: Inter-GPU communication compression for Large Language Models leads to up to 2x reduction of time-to-first-token with negligible model performance degradation.
  description_simple: Big AI models are split across multiple GPUs that constantly exchange data. By compressing this data 3.5–4.5x, we make them start answering up to twice as fast, with almost no loss in quality.
  image: comComp_before.png
  venue: NeurIPS, 2024
  awards: Workshop
  authors:
  - palmus
  - le
  - hausdörfer
  - verma
- id2: agnathax
  title: Deep reinforcement learning for investigating stretch feedback during swimming of the lamprey
  description: In a simulated lamprey robot without direct inter-segmental coupling, stretch feedback learned via deep RL coordinates swimming. Local, caudally directed, stretch-rate information proves key, and weight-shared local networks learn 2–3× faster and more consistently.
  description_simple: We use robots to investigate how animals like the eel-like lamprey move. With biologically inspired feedback, where each body section senses only how its neighbors bend, the robot learns faster and more reliably.
  image: agnathax_before.png
  image_mouseover: agnathax_after.mp4
  venue: Bioinspiration & Biomimetics, 2025
  awards: Journal
  paper: https://iopscience.iop.org/article/10.1088/1748-3190/adb8b1
  authors:
  - hausdörfer
  - gupta
  - ijspeert
  - renj
- id2: mechanobiology
  title: "Mechanoactivation of Single Stem Cells in Microgels Using a 3D-Printed Stimulation Device"
  venue: Small Methods, 2024
  description: "3D-printed chip for mechanoactivation at single-cell level to study intracellular calcium signaling and translocation."
  description_simple: A 3D-printed chip that squeezes many stem cells at once, each tucked into its own tiny gel bead, so we can watch under the microscope how single cells sense and respond to pressure. This could help make stem-cell therapies, such as repairing bone or cartilage, more effective.
  paper: https://onlinelibrary.wiley.com/doi/10.1002/smtd.202400272

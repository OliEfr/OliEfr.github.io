- id2: locomposition
  title: "LoComposition: Terrain-Adaptive Energy-Efficient Quadruped Locomotion without Gait Priors"
  description: Functionally decomposing locomotion into task reward, constraints, energy minimization and perception yields terrain-adaptive gaits without explicit gait priors, cutting cost of transport by 56% and limit violations by 96%, with zero-shot transfer to a Go2.
  description_simple: Splitting a robot dog's training into separate jobs (follow commands, stay within its physical limits, save energy, see the terrain ahead) lets it find an efficient trot by itself, without hand-engineered specifications.
  image: locomposition_before.jpg
  image_mouseover: locomposition_after.mp4
  venue: CoRL, 2026

- id2: latentActionPriors
  title: Synergistic Action and Style Priors for Learning Legged Locomotion
  project_page: https://sites.google.com/view/latent-action-priors
  arxiv: "2410.03246"
  description: A single gait cycle of expert demonstration significantly improves achieved reward and visual appearance of the learned gait in locomotion tasks - even for transfer tasks.
  description_simple: An LLM can generate one short walking example, which helps a legged robot learn to walk better and more naturally — even in situations the example never covered, like steering or rough ground. This allows non-experts to easily program walking robots.
  image: lap_before.jpg
  image_mouseover: lap_after.mp4
  venue: Humanoids, 2026
  awards: Conference
